<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>C# Blazor WebAssembly Application — Scenario 1 Monolithic</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 2rem; }
    code { background: #f2f2f2; padding: 0.1rem 0.3rem; }
    .ok { color: #0a7; }
    .fail { color: #c00; }
  </style>
</head>
<body>
  <h1>C# Blazor WebAssembly Application</h1>
  <p>Scenario 1 — Monolithic / flat (single module)</p>
  <p>Branch: <code id="branch">loading…</code></p>
  <p>Customer Version: <code id="version">loading…</code></p>
  <p>Health: <code id="health">loading…</code></p>
  <p>PUT/GET: <code id="flow">loading…</code></p>
  <p>Stats: <code id="stats">loading…</code></p>
  <script>
    async function run() {
      const version = await (await fetch('/version')).json();
      document.getElementById('branch').textContent = version.branch;
      document.getElementById('version').textContent = version.customer_version;
      const health = await (await fetch('/health')).json();
      document.getElementById('health').textContent = health.status + ' / nodes=' + health.nodes;
      await fetch('/app/product:1001', { method: 'PUT', body: 'Visvantha' });
      const got = await (await fetch('/app/product:1001')).json();
      document.getElementById('flow').textContent = got.status + ' ' + got.value;
      document.getElementById('stats').textContent = await (await fetch('/app/stats')).text();
    }
    run().catch(err => document.getElementById('flow').textContent = err);
  </script>
</body>
</html>
